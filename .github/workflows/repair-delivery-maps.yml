name: Repair delivery map consistency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          order_path = Path('docs/order-placed.html')
          payment_path = Path('docs/payment-confirmation.html')
          order = order_path.read_text(encoding='utf-8')
          payment = payment_path.read_text(encoding='utf-8')

          # Order Placed: make the visible destination label data-driven.
          order = order.replace(
              'Destination: Your address',
              'Destination: <span id="mapDestinationLabel">Your address</span>',
              1
          )
          if 'id="mapDestinationLabel"' in order and 'MAP_DESTINATION_REAL_ADDRESS_FIX_V1' not in order:
              marker = '<!-- MAP_DESTINATION_REAL_ADDRESS_FIX_V1 -->'
              script = r'''<script>
// MAP_DESTINATION_REAL_ADDRESS_FIX_V1
(function(){
  function getOrder(){
    try { return JSON.parse(localStorage.getItem('tesla_last_order') || 'null'); } catch(e){ return null; }
  }
  function applyDestination(){
    var label=document.getElementById('mapDestinationLabel');
    var order=getOrder();
    var d=order && (order.deliveryDetails || order.delivery_details || order.delivery);
    if(!label || !d) return;
    if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){return}}
    var parts=[d.address||d.street, d.city, d.state, d.zipCode||d.zip, d.country].filter(function(v){return v && String(v).trim()});
    if(parts.length) label.textContent=parts.join(', ');
  }
  function hideMapAttribution(){
    var style=document.getElementById('hideLeafletAttribution');
    if(!style){style=document.createElement('style');style.id='hideLeafletAttribution';style.textContent='.leaflet-control-attribution{display:none!important;}';document.head.appendChild(style)}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){applyDestination();hideMapAttribution()},{once:true});
  else {applyDestination();hideMapAttribution()}
  setTimeout(applyDestination,1000);
})();
</script>'''
              order = order.replace('</body>', marker+'\n'+script+'\n</body>', 1)

          # Payment Confirmation: use the exact Order Placed map presentation/logic.
          payment = payment.replace('Live Delivery Tracking', 'Delivery Route', 1)

          old_track = '''    <a class="btn-pc-outline" href="track.html" id="trackBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16 10,8"/></svg>
      Track Order
    </a>
'''
          if old_track in payment:
              payment = payment.replace(old_track, '', 1)
          else:
              payment = re.sub(r'\s*<a[^>]*id="trackBtn"[\s\S]*?</a>\s*', '\n', payment, count=1)

          # Match the Order Placed map legend and hide Leaflet's attribution chrome.
          payment = payment.replace(
              '<div id="confMap"></div>',
              '''<div id="confMap"></div><div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#888;"><span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;background:#E31937;border-radius:50%;display:inline-block;"></span> Origin: Tesla Factory, Fremont CA</span><span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;background:#00A550;border-radius:50%;display:inline-block;"></span> Destination: <span id="paymentMapDestinationLabel">Your address</span></span></div>''',
              1
          )
          if 'MAP_PAYMENT_MAP_SYNC_V1' not in payment:
              marker = '<!-- MAP_PAYMENT_MAP_SYNC_V1 -->'
              style = '<style id="hideLeafletAttribution">.leaflet-control-attribution{display:none!important;}</style>\n'
              payment = payment.replace('</head>', style+'</head>', 1)

              new_map = r'''  var mapInited = false;
  function initMap(dd) {
    if (mapInited || !window.L) return;
    mapInited = true;
    var origin=[37.4936,-121.9448];
    dd=dd||{};
    var city=dd.city||'', state=dd.state||'', country=dd.country||'';
    var map=L.map('confMap').setView([(origin[0]+40.7128)/2,(origin[1]-74.0060)/2],4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(map);
    var rI=L.divIcon({html:'<div style="width:14px;height:14px;background:#E31937;border-radius:50%;border:2px solid white;box-shadow:0 2px 8px rgba(227,25,55,.5)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
    var gI=L.divIcon({html:'<div style="width:14px;height:14px;background:#00A550;border-radius:50%;border:2px solid white;box-shadow:0 2px 8px rgba(0,165,80,.5)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
    var tI=L.divIcon({html:'<div style="font-size:20px;line-height:1;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E31937" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>',className:'',iconSize:[24,24],iconAnchor:[12,12]});
    L.marker(origin,{icon:rI}).addTo(map).bindPopup('<strong>Tesla Factory</strong><br>Fremont, CA — Origin');
    var dest=[40.7128,-74.0060];
    var destMk=L.marker(dest,{icon:gI}).addTo(map).bindPopup('<strong>Delivery Destination</strong><br>'+(city||'')+(country?', '+country:''));
    var mid=[(origin[0]+dest[0])/2,(origin[1]+dest[1])/2];
    var t=L.marker(mid,{icon:tI}).addTo(map).bindPopup('<strong>Your Tesla</strong><br>En Route');
    var line=L.polyline([origin,dest],{color:'#E31937',weight:2.5,opacity:.55,dashArray:'8,8'}).addTo(map);
    map.fitBounds(L.latLngBounds([origin,dest]),{padding:[40,40]});
    var address=[dd.address||dd.street,city,state,dd.zipCode||dd.zip,country].filter(Boolean).join(', ');
    var label=document.getElementById('paymentMapDestinationLabel'); if(label && address) label.textContent=address;
    if(city||state||country){
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent([city,state,country].filter(Boolean).join(', ')))
      .then(function(r){return r.json()})
      .then(function(d){if(d.length){dest=[parseFloat(d[0].lat),parseFloat(d[0].lon)];destMk.setLatLng(dest).bindPopup('<strong>Delivery Destination</strong><br>'+address);line.setLatLngs([origin,dest]);map.fitBounds(L.latLngBounds([origin,dest]),{padding:[40,40]});}})
      .catch(function(){});
    }
    var p=0;setInterval(function(){p=(p+.003)%1;t.setLatLng([origin[0]+(dest[0]-origin[0])*p+Math.sin(p*12)*.05,origin[1]+(dest[1]-origin[1])*p+Math.cos(p*12)*.05])},80);
  }
'''
              payment = re.sub(r'  var mapInited = false;\n  function initMap\(dd\) \{[\s\S]*?\n  \}\n\n  // Fetch proof status by customer email', new_map+'\n  // Fetch proof status by customer email', payment, count=1)
              payment = payment.replace(marker, '', 1) if marker in payment else payment
              payment = payment.replace('<!-- MAP_PAYMENT_MAP_SYNC_V1 -->', marker, 1)

          order_path.write_text(order, encoding='utf-8')
          payment_path.write_text(payment, encoding='utf-8')

      - name: Validate changed files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['docs/order-placed.html','docs/payment-confirmation.html']:
              s=Path(f).read_text()
              assert '</html>' in s and '</body>' in s, f'{f}: malformed HTML'
              assert s.count('<script') == s.count('</script>'), f'{f}: script tag mismatch'
          p=Path('docs/payment-confirmation.html').read_text()
          assert 'id="trackBtn"' not in p, 'Track Order CTA still present'
          assert 'Delivery Route' in p, 'Payment map heading missing'
          assert 'MAP_PAYMENT_MAP_SYNC_V1' in p, 'Payment map sync marker missing'
          o=Path('docs/order-placed.html').read_text()
          assert 'mapDestinationLabel' in o, 'Order destination label missing'
          assert 'MAP_DESTINATION_REAL_ADDRESS_FIX_V1' in o, 'Order destination fix missing'
          print('Targeted validation passed')
          PY

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/order-placed.html docs/payment-confirmation.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: synchronize delivery maps and destination address'
          git push
